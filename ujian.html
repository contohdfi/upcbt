<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Ujian CBT - Siswa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 sm:px-6 py-3 shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white shadow-md shadow-emerald-600/20">
          <i data-lucide="graduation-cap" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-bold text-slate-900 text-base sm:text-lg tracking-tight">Portal Ujian CBT</h1>
          <p class="text-xs text-slate-500 font-medium" id="header-siswa">Peserta Ujian</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="logout()" class="p-2 rounded-xl bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-600 border border-slate-200 transition" title="Keluar">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- SELEKSI JADWAL UJIAN -->
  <div id="view-dashboard" class="max-w-4xl mx-auto w-full p-4 sm:p-6 flex-1 space-y-6">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-xl font-black text-slate-900">Jadwal Ujian Aktif</h2>
        <p class="text-xs text-slate-500">Pilih ujian yang sedang berlangsung untuk kelas Anda</p>
      </div>
      <button onclick="loadUjian()" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold flex items-center gap-1.5 transition">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
        <span>Segarkan</span>
      </button>
    </div>

    <div id="list-ujian" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="p-8 text-center text-slate-400 text-xs col-span-2">Memeriksa jadwal ujian aktif dari spreadsheet...</div>
    </div>
  </div>

  <!-- MODAL TOKEN UJIAN -->
  <div id="modal-token" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
    <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-2xl max-w-sm w-full text-center space-y-4">
      <div class="w-14 h-14 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center mx-auto shadow-inner">
        <i data-lucide="key" class="w-7 h-7"></i>
      </div>
      <div>
        <h3 class="font-black text-slate-900 text-lg">Konfirmasi Token Ujian</h3>
        <p class="text-xs text-slate-500 mt-1" id="lbl-nama-ujian">Nama Ujian</p>
      </div>
      <input type="text" id="inp-token" placeholder="TOKEN" uppercase
        class="w-full py-3 bg-slate-50 border border-slate-200 rounded-2xl text-center font-mono font-black text-lg tracking-widest text-amber-700 focus:outline-none focus:border-amber-500" />
      <div class="flex gap-2">
        <button onclick="tutupModalToken()" class="flex-1 py-2.5 rounded-2xl bg-slate-100 text-slate-700 font-bold text-xs">Batal</button>
        <button onclick="validasiDanMulai()" class="flex-1 py-2.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-md">Mulai Ujian</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbysSoJeaz2W66vpxVDPhceruKBZNAYMKp7qDi6k9LWFvW8aIjVtD_dL6trA2NyEFY4pbQ/exec';

    let selectedExam = null;
    lucide.createIcons();

    window.onload = () => {
      if (localStorage.getItem('cbt_role') !== 'Peserta') {
        window.location.href = 'index.html';
        return;
      }
      document.getElementById('header-siswa').innerText = localStorage.getItem('cbt_nama') + ' (' + (localStorage.getItem('cbt_kelas') || 'Kelas') + ')';
      loadUjian();
    };

    async function loadUjian() {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'getPesertaData',
            user_id: localStorage.getItem('cbt_user_id'),
            kelas: localStorage.getItem('cbt_kelas')
          })
        }).then(r => r.json());

        if (res.status === 'success') {
          document.getElementById('list-ujian').innerHTML = res.data.map(u => `
            <div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm space-y-4 flex flex-col justify-between">
              <div>
                <span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-bold">${u.mapel}</span>
                <h3 class="font-bold text-slate-900 text-base mt-2">${u.nama}</h3>
                <p class="text-xs text-slate-500 mt-1">Durasi: ${u.durasi} Menit</p>
              </div>
              <button onclick="bukaModalToken('${u.id}', '${u.nama}')" class="w-full py-2.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-md transition flex items-center justify-center gap-2">
                <span>Kerjakan Ujian</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
              </button>
            </div>
          `).join('') || '<div class="p-8 text-center text-slate-400 text-xs col-span-2">Tidak ada jadwal ujian aktif untuk kelas Anda saat ini.</div>';
          lucide.createIcons();
        }
      } catch (err) {
        console.error(err);
      }
    }

    function bukaModalToken(id, nama) {
      selectedExam = { id, nama };
      document.getElementById('lbl-nama-ujian').innerText = nama;
      document.getElementById('inp-token').value = '';
      document.getElementById('modal-token').classList.remove('hidden');
    }

    function tutupModalToken() {
      document.getElementById('modal-token').classList.add('hidden');
    }

    async function validasiDanMulai() {
      const token = document.getElementById('inp-token').value.trim().toUpperCase();
      if (!token) return alert('Masukkan token ujian!');
      
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'validasiToken', ujian_id: selectedExam.id, token: token })
      }).then(r => r.json());

      if (res.status === 'success') {
        alert('Token Valid! Lembar ujian akan dibuka.');
      } else {
        alert(res.msg || 'Token salah!');
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
