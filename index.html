<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal CBT Modern - Darul Fawaid Ilmiyah</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 10% 20%, rgb(15, 23, 42) 0%, rgb(30, 41, 59) 90%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      color: #fff;
    }
    .brand-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
    }
    .form-control {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.95rem;
    }
    .form-control:focus {
      background: rgba(15, 23, 42, 0.9);
      border-color: #10b981;
      color: #fff;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
    }
    .form-control::placeholder { color: #94a3b8; }
    .btn-login {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      color: white;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 12px;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
    }
    .quick-pill {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-pill:hover { background: rgba(16, 185, 129, 0.2); border-color: #10b981; color: #fff; }
  </style>
</head>
<body>

<div class="login-container">
  <div class="brand-icon">
    <i class="fas fa-graduation-cap fa-2x text-white"></i>
  </div>
  <div class="text-center mb-4">
    <h3 class="fw-bold mb-1">CBT Portal Ujian</h3>
    <p class="text-secondary small mb-0">Darul Fawaid Ilmiyah</p>
  </div>

  <form onsubmit="prosesLogin(event)">
    <div class="mb-3">
      <label class="form-label text-light small fw-semibold">Username / NIS / NIP</label>
      <div class="input-group">
        <span class="input-group-text bg-transparent border-end-0 border-white-50 text-secondary"><i class="fas fa-user"></i></span>
        <input type="text" id="username" class="form-control border-start-0 ps-0" placeholder="Masukkan ID Login Anda" required>
      </div>
    </div>

    <div class="mb-4">
      <div class="d-flex justify-content-between">
        <label class="form-label text-light small fw-semibold">Password</label>
        <span class="text-secondary small cursor-pointer" onclick="togglePass()" id="lblPass"><i class="fas fa-eye"></i> Lihat</span>
      </div>
      <div class="input-group">
        <span class="input-group-text bg-transparent border-end-0 border-white-50 text-secondary"><i class="fas fa-lock"></i></span>
        <input type="password" id="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
      </div>
    </div>

    <button type="submit" class="btn btn-login w-100 mb-3" id="btnLogin">
      <i class="fas fa-sign-in-alt me-2"></i> MASUK KE PORTAL
    </button>
  </form>

  <div id="msg" class="text-danger text-center small mb-3"></div>

  <div class="border-top border-white-10 pt-3">
    <div class="text-secondary small text-center mb-2">Akun Demo Cepat:</div>
    <div class="d-flex justify-content-center gap-2 flex-wrap">
      <span class="quick-pill" onclick="isiAkun('admin', 'admin123')"><i class="fas fa-shield-alt text-danger me-1"></i> Admin</span>
      <span class="quick-pill" onclick="isiAkun('guru01', 'guru123')"><i class="fas fa-chalkboard-teacher text-info me-1"></i> Guru</span>
      <span class="quick-pill" onclick="isiAkun('siswa01', 'siswa123')"><i class="fas fa-user-graduate text-success me-1"></i> Siswa</span>
    </div>
  </div>
</div>

<script>
  // URL Web App Google Apps Script Aktif
  const API_URL = 'https://script.google.com/macros/s/AKfycbxY35_7Io1cGVVwzwsEn66htauRqvrouHTFm12H8d--MkNA5vNZcVgDuuR9c2fb6X_E2g/exec';

  function isiAkun(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
  }

  function togglePass() {
    let inp = document.getElementById('password');
    let lbl = document.getElementById('lblPass');
    if (inp.type === 'password') {
      inp.type = 'text';
      lbl.innerHTML = '<i class="fas fa-eye-slash"></i> Sembunyi';
    } else {
      inp.type = 'password';
      lbl.innerHTML = '<i class="fas fa-eye"></i> Lihat';
    }
  }

  async function prosesLogin(e) {
    e.preventDefault();
    let btn = document.getElementById('btnLogin');
    let msg = document.getElementById('msg');
    let valUser = document.getElementById('username').value.trim();
    let valPass = document.getElementById('password').value.trim();

    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Menghubungkan...';
    btn.disabled = true;
    msg.innerHTML = '';

    try {
      let res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', username: valUser, password: valPass })
      }).then(r => r.json());

      if (res.status === 'success') {
        localStorage.setItem('cbt_user_id', res.user_id);
        localStorage.setItem('cbt_role', res.role);
        localStorage.setItem('cbt_nama', res.nama);
        localStorage.setItem('cbt_kelas', res.kelas || '');
        localStorage.setItem('cbt_mapel', res.mapel || '');
        localStorage.setItem('cbt_token', res.token || '');

        if (res.role === 'Admin') window.location.href = 'admin.html';
        else if (res.role === 'Guru') window.location.href = 'guru.html';
        else window.location.href = 'ujian.html';
      } else {
        msg.innerHTML = '<i class="fas fa-exclamation-triangle me-1"></i> ' + (res.msg || 'Login gagal!');
      }
    } catch (err) {
      msg.innerHTML = '<i class="fas fa-wifi me-1"></i> Gagal terhubung ke Google Script. Pastikan Web App disetel ke "Anyone".';
    }
    btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> MASUK KE PORTAL';
    btn.disabled = false;
  }
</script>
</body>
</html>
