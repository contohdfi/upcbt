<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal CBT Modern - Darul Fawaid Ilmiyah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Background Ambient Glow -->
  <div class="absolute top-10 left-10 w-96 h-96 bg-emerald-100/60 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-10 right-10 w-96 h-96 bg-sky-100/60 rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-xl relative z-10">
    
    <!-- Brand Header -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-600 text-white shadow-lg shadow-emerald-600/20 mb-3.5">
        <i data-lucide="graduation-cap" class="w-8 h-8"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-900 tracking-tight">Portal Ujian CBT</h2>
      <p class="text-xs text-slate-500 font-medium mt-1">Darul Fawaid Ilmiyah • Modern CBT Engine</p>
    </div>

    <!-- Login Form -->
    <form onsubmit="prosesLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">Username / NIS / NIP</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="user" class="w-4 h-4"></i>
          </div>
          <input type="text" id="username" placeholder="Masukkan username atau NIS..." required
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs sm:text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:bg-white transition" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">Password</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="lock" class="w-4 h-4"></i>
          </div>
          <input type="password" id="password" placeholder="Masukkan password..." required
            class="w-full pl-10 pr-11 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs sm:text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:bg-white transition" />
          <button type="button" onclick="togglePass()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
            <i data-lucide="eye" id="pass-icon" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div id="msg" class="hidden p-3 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center gap-2"></div>

      <button type="submit" id="btnLogin"
        class="w-full py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm shadow-md flex items-center justify-center gap-2 transition active:scale-95">
        <span>Masuk ke Sistem CBT</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <!-- Quick Demo Accounts -->
    <div class="mt-6 pt-5 border-t border-slate-100">
      <div class="flex items-center gap-1.5 text-xs text-slate-400 font-semibold mb-2.5">
        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-500"></i>
        <span>Pilihan Akun Demo:</span>
      </div>

      <div class="grid grid-cols-3 gap-2">
        <button type="button" onclick="isiAkun('admin', '123')"
          class="p-2 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 text-[11px] font-bold flex flex-col items-center gap-1 transition">
          <i data-lucide="shield" class="w-4 h-4 text-purple-600"></i>
          <span>Admin</span>
        </button>

        <button type="button" onclick="isiAkun('anam', '123')"
          class="p-2 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 text-[11px] font-bold flex flex-col items-center gap-1 transition">
          <i data-lucide="book-open" class="w-4 h-4 text-sky-600"></i>
          <span>Guru (Ust. Abdullah)</span>
        </button>

        <button type="button" onclick="isiAkun('fadol', '123')"
          class="p-2 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 text-[11px] font-bold flex flex-col items-center gap-1 transition">
          <i data-lucide="user-check" class="w-4 h-4 text-emerald-600"></i>
          <span>Siswa (Fadol)</span>
        </button>
      </div>
    </div>

  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxY35_7Io1cGVVwzwsEn66htauRqvrouHTFm12H8d--MkNA5vNZcVgDuuR9c2fb6X_E2g/exec';

    lucide.createIcons();

    function isiAkun(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
      document.getElementById('msg').classList.add('hidden');
    }

    function togglePass() {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    async function prosesLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const msg = document.getElementById('msg');
      const valUser = document.getElementById('username').value.trim();
      const valPass = document.getElementById('password').value.trim();

      btn.innerHTML = '<span class="inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span> Menghubungkan...';
      btn.disabled = true;
      msg.classList.add('hidden');

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'login', username: valUser, password: valPass })
        }).then(r => r.json());

        if (res.status === 'success') {
          localStorage.setItem('cbt_user_id', res.user_id);
          localStorage.setItem('cbt_role', res.role);
          localStorage.setItem('cbt_nama', res.nama);
          localStorage.setItem('cbt_kelas', res.kelas || '');
          localStorage.setItem('cbt_mapel', res.mapel || '');
          localStorage.setItem('cbt_token', res.token || '');

          if (res.role === 'Admin') window.location.href = 'admin.html';
          else if (res.role === 'Guru') window.location.href = 'guru.html';
          else window.location.href = 'ujian.html';
        } else {
          msg.textContent = res.msg || 'Username atau password salah.';
          msg.classList.remove('hidden');
        }
      } catch (err) {
        msg.textContent = 'Gagal terhubung ke Google Apps Script Web App. Pastikan Web App disetel ke Anyone.';
        msg.classList.remove('hidden');
      } finally {
        btn.innerHTML = '<span>Masuk ke Sistem CBT</span><i data-lucide="arrow-right" class="w-4 h-4"></i>';
        btn.disabled = false;
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
